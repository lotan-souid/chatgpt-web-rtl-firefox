<!doctype html>
<html lang="he" dir="rtl">
  <head>
    <meta charset="utf-8">
    <title>ChatGPT Web RTL</title>
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <h1>ChatGPT Web RTL</h1>

    <label class="row">
      <input id="enabled" type="checkbox">
      <span>הפעלת התוסף</span>
    </label>

    <fieldset id="details">
      <label class="row">
        <input id="force-rtl" type="checkbox">
        <span>אילוץ עברית בכל ההודעות</span>
      </label>

      <label class="row">
        <input id="patch-composer" type="checkbox">
        <span>כיוון אוטומטי בתיבת הכתיבה</span>
      </label>

      <label class="row">
        <input id="patch-sidebar" type="checkbox">
        <span>כיוון אוטומטי ברשימת השיחות</span>
      </label>
    </fieldset>

    <p id="status" role="status" aria-live="polite"></p>
    <p class="hint">קיצור מקלדת: <kbd>Alt+Shift+R</kbd></p>
    <a id="options" href="#">הגדרות נוספות</a>

    <script src="../src/settings.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
