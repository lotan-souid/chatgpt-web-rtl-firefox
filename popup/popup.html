<!doctype html>
<html lang="he" dir="rtl">
  <head>
    <meta charset="utf-8">
    <title>ChatGPT Web RTL</title>
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <h1>ChatGPT Web RTL</h1>

    <label class="row">
      <input id="enabled" type="checkbox">
      <span>הפעלת התוסף</span>
    </label>

    <!-- Outside the fieldset on purpose: it must stay usable while the
         extension is off, since it is how the page switches it back on. -->
    <label class="row">
      <input id="floating-toggle" type="checkbox">
      <span>כפתור הפעלה בתוך הדף</span>
    </label>

    <fieldset id="details">
      <label class="field">
        <span>כיוון הטקסט</span>
        <select id="mode">
          <option value="message">לפי הודעה</option>
          <option value="auto">לפי פסקה</option>
          <option value="rtl">תמיד מימין לשמאל</option>
        </select>
      </label>

      <label class="row">
        <input id="patch-composer" type="checkbox">
        <span>כיוון אוטומטי בתיבת הכתיבה</span>
      </label>

      <label class="row">
        <input id="patch-sidebar" type="checkbox">
        <span>כיוון אוטומטי ברשימת השיחות</span>
      </label>
    </fieldset>

    <p id="status" role="status" aria-live="polite"></p>
    <p class="hint">קיצור מקלדת: <kbd>Alt+Shift+R</kbd></p>
    <a id="options" href="#">הגדרות נוספות</a>

    <script src="../src/settings.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
